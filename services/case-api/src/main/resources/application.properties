spring.application.name=case-api

# Optional Compose MySQL for hand diagnose (see case/docker/mysql).
spring.datasource.url=jdbc:mysql://localhost:3306/case
spring.datasource.username=case-user
spring.datasource.password=case

# Flyway owns schema (V* under classpath:db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
