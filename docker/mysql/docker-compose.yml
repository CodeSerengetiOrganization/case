services:
  mysql:
    image: mysql:8.0.21
    container_name: case-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: case-root
      MYSQL_DATABASE: case
      MYSQL_USER: case-user
      MYSQL_PASSWORD: case
    volumes:
      - case-mysql-data:/var/lib/mysql

volumes:
  case-mysql-data:
